name: Sharwi CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sharwi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Build backend
        run: npm run build:backend
      - name: Typecheck Expo mobile application
        run: npm run typecheck:mobile
      - name: Build landing
        run: npm run build
